<button class="btn btn-xs m-4" onclick="my_modal_1.showModal()">InfoUser</button>


<dialog id="my_modal_1" class="modal">
  <div class="modal-box max-w-xl">
    <!-- TÍTULO -->
    <h3 class="font-bold text-xl mb-2">Crear deportista</h3>
    <p class="text-sm opacity-70 mb-6">
      Información personal del usuario
    </p>

    <!-- FORMULARIO -->
    <form method="dialog" class="space-y-4" [formGroup]="deportistaForm" (ngSubmit)="save()">

      <!-- Nombre -->
      <div class="form-control">
        <label class="label">
          <span class="label-text">Nombre</span>
        </label>
        <input type="text" formControlName="nombre" class="input input-bordered w-full" placeholder="Nombre completo" />
      </div>

      <!-- Edad y Disciplina -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="form-control">
          <label class="label">
            <span class="label-text">Edad</span>
          </label>
          <input type="number" formControlName="edad" class="input input-bordered w-full" placeholder="Edad" />
        </div>

        <div class="form-control">
          <label class="label">
            <span class="label-text">Disciplina</span>
          </label>
          <input type="text" formControlName="disciplina_deportiva" class="input input-bordered w-full"
            placeholder="Running, Ciclismo…" />
        </div>
      </div>

      <!-- Nacionalidad y Teléfono -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="form-control">
          <label class="label">
            <span class="label-text">Nacionalidad</span>
          </label>
          <input type="text" formControlName="nacionalidad" class="input input-bordered w-full" placeholder="España" />
        </div>

        <div class="form-control">
          <label class="label">
            <span class="label-text">Teléfono</span>
          </label>
          <input type="text" formControlName="telefono" class="input input-bordered w-full" placeholder="600123456" />
        </div>
      </div>

      <!-- ACCIONES -->
      <div class="modal-action mt-6">
        <button type="button" class="btn btn-ghost" (click)="closeModal()">
          Cancelar
        </button>
        <button type="submit" class="btn btn-primary">
          Guardar
        </button>
      </div>
    </form>
  </div>
</dialog>
